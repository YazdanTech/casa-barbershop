name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to IONOS /dubai via SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USERNAME,$SFTP_PASSWORD" \
            -e "set sftp:auto-confirm yes; set net:timeout 15; set net:max-retries 3; mkdir -p /dubai; mirror --reverse --delete --only-newer --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .DS_Store --exclude-glob README.md . /dubai; bye" \
            "sftp://$SFTP_HOST:22"
